[package]
name = "cabo-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
cabo-shared.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_asset", "bevy_camera", "bevy_color", "bevy_core_pipeline",
    "bevy_render", "bevy_pbr", "bevy_image", "bevy_sprite", "bevy_sprite_render", "bevy_window",
    "bevy_winit", "webgl2", "x11"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "Location", "MediaQueryList", "NodeList"] }
wasm-bindgen = "0.2"
